# XcodeGen spec — run `xcodegen generate` (on a Mac) to create KBKCam.xcodeproj
name: KBKCam
options:
  bundleIdPrefix: com.kbk
  deploymentTarget:
    iOS: "16.0"
packages:
  HaishinKit:
    url: https://github.com/shogo4405/HaishinKit.swift
    exactVersion: 2.2.5
targets:
  KBKCam:
    type: application
    platform: iOS
    sources:
      - path: KBKCam
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
    settings:
      base:
        PRODUCT_NAME: KBKCam
        PRODUCT_BUNDLE_IDENTIFIER: com.kbk.cam
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: KBKCam/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
